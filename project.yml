name: UITestBench

options:
  bundleIdPrefix: com.uitestbench
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"

targets:
  UITestBenchCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/UITestBenchCore

  UITestBenchApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/UITestBenchApp
        excludes:
          - "Resources/**"
      - path: Sources/UITestBenchApp/Resources
        buildPhase: resources
    dependencies:
      - target: UITestBenchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uitestbench.app
        PRODUCT_NAME: UITestBenchApp
    info:
      path: Project/UITestBenchApp-Info.plist
      properties:
        CFBundleDisplayName: UI验收台
        CFBundleName: UI验收台
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "7"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true

  UITestBenchCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UITestBenchCoreTests
    dependencies:
      - target: UITestBenchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uitestbench.coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UITestBench:
    build:
      targets:
        UITestBenchApp: all
        UITestBenchCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UITestBenchCoreTests
